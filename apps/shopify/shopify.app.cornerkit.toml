# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7832bbc601367b0e8a58c8bb4098b25b"
name = "cornerKit"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2024-10"

# App lifecycle webhook
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks"

# GDPR compliance webhooks are configured in Partners Dashboard > App Setup > GDPR
# They automatically route to /webhooks endpoint

[access_scopes]
scopes = "read_themes,write_themes"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/auth/callback" ]
